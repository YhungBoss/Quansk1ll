<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quanskill</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="left">

    <div class="top-bar">

        <div class="logo">
            <img src="images/logo.svg" alt="Quanskill Logo">
        </div>

        <a href="#" class="back-home">
            Back to Homepage
            <span>&rsaquo;</span>
        </a>

    </div>

    <div class="login-wrapper">

        <div class="login-card">

    <div class="avatar">
        <img src="images/avatar.png" alt="Avatar">
    </div>

    <h2>Hey There, Welcome Back</h2>

    <p>Enter your details to continue</p>

    <div class="social-login">

        <button class="social-btn">
            <img src="images/google.png" alt="">
            <span>Sign in with Google</span>
        </button>

        <button class="social-btn">
            <img src="images/apple.png" alt="">
            <span>Sign in with Apple</span>
        </button>

    </div>

    <div class="divider">
        <span>Or continue with</span>
    </div>

    <form>

        <div class="input-group">

            <label>Email Address</label>

            <input type="email">

        </div>

        <div class="input-group">

            <label>Password</label>

            <div class="password-box">

                <input type="password">

                <button type="button" class="eye-btn">
                    👁
                </button>

            </div>

        </div>

        <div class="options">

            <label class="remember">

                <input type="checkbox">

                Keep me logged in

            </label>

            <a href="#">Forgot Password?</a>

        </div>

        <button class="login-btn">

            Login

            <span>▶</span>

        </button>

    </form>

    <p class="register">
        Don't have an account?
        <a href="#">Register</a>
    </p>

</div>

    </div>

</div>

    <div class="right">

    <div class="right-overlay">

        <img src="images/shape-1.png" class="shape shape-1" alt="">
        <img src="images/shape-2.png" class="shape shape-2" alt="">
        
     <div class="illustration">

        <img src="images/robot.png" class="robot" alt="">
        <img src="images/student.png" class="student" alt="">

     </div>

    </div>

</div>

</div>

</body>
</html>
